<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
<title>Drift Car Desktop Pet</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
#world{position:relative;width:100%;height:100%;overflow:hidden}
#car{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#tire-marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#smoke-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.smoke{position:absolute;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),rgba(207,216,222,.55) 48%,rgba(160,170,180,0));filter:blur(2px);animation:smoke 1250ms ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:scale(.55)}55%{opacity:.4}100%{opacity:0;transform:translate(var(--dx),-58px) scale(3.3)}}
.skid{position:absolute;height:3px;width:30px;border-radius:4px;background:rgba(35,39,44,.32);transform-origin:right center;animation:skid 1.2s linear forwards}
@keyframes skid{to{opacity:0;transform:scaleX(2.3)}}
</style>
</head>
<body>
<div id="world"><canvas id="car"></canvas><div id="smoke-layer"></div></div>
<script src="/renderer.bundle.js"></script>
</body>
</html>
